<html lang="zh-CN">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#005375" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="哈尔滨工业大学（深圳）学生艺术团话剧部（告白话剧社）演出与成员记录。In a moment we go back."
    />
    <title>In a moment we go back.</title>
    <script>
      // 在 CSS 渲染前确定主题，避免白屏闪烁
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored || (prefersDark ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
    <script type="text/javascript" charset="UTF-8">
      ;(function () {
        try {
          if (typeof WeixinJSBridge == 'object' && typeof WeixinJSBridge.invoke == 'function') {
            handleFontSize()
          } else {
            if (document.addEventListener) {
              document.addEventListener('WeixinJSBridgeReady', handleFontSize, false)
            } else if (document.attachEvent) {
              document.attachEvent('WeixinJSBridgeReady', handleFontSize)
              document.attachEvent('onWeixinJSBridgeReady', handleFontSize)
            }
          }
          function handleFontSize() {
            // 设置网页字体为默认大小
            WeixinJSBridge.invoke('setFontSizeCallback', { fontSize: 0 })
            // 重写设置网页字体大小的事件
            WeixinJSBridge.on('menu:setfont', function () {
              WeixinJSBridge.invoke('setFontSizeCallback', { fontSize: 0 })
            })
          }
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="/GoBack/assets/index-cVIdc6WF.js"></script>
    <link rel="stylesheet" crossorigin href="/GoBack/assets/index-C6jRN6jq.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
